---
- name: Read the device public key from the controller
  ansible.builtin.set_fact:
    admin_vpn_device_public_key: "{{ lookup('file', playbook_dir ~ '/../../private/wireguard/admin.pub') | trim }}"

- name: Validate the device public key
  ansible.builtin.assert:
    that:
      - admin_vpn_device_public_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: Prepare the device WireGuard key on the workstation first.

- name: Configure the administration VPN guest
  become: true
  when: not ansible_check_mode
  block:
    - name: Install WireGuard tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Protect the WireGuard directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Generate and preserve the gateway private key
      ansible.builtin.shell: |
        set -eu
        umask 077
        candidate=$(mktemp /etc/wireguard/.admin-key.XXXXXX)
        trap 'rm -f "$candidate"' EXIT
        wg genkey > "$candidate"
        mv "$candidate" /etc/wireguard/admin.key
      args:
        creates: /etc/wireguard/admin.key
      no_log: true

    - name: Enforce private key permissions
      ansible.builtin.file:
        path: /etc/wireguard/admin.key
        owner: root
        group: root
        mode: '0600'

    - name: Write the gateway configuration without exporting its private key
      ansible.builtin.shell: |
        set -eu
        umask 077
        candidate=$(mktemp /etc/wireguard/.wg-admin.XXXXXX)
        trap 'rm -f "$candidate"' EXIT
        {
          printf '[Interface]\nAddress = %s\nListenPort = 51821\nPrivateKey = ' {{ admin_vpn.address | quote }}
          cat /etc/wireguard/admin.key
        {% if admin_vpn.client_enabled | default(true) | bool %}
          printf '\n[Peer]\nPublicKey = %s\nAllowedIPs = %s\n' {{ admin_vpn_device_public_key | quote }} {{ admin_vpn.client_address | quote }}
        {% endif %}
        } > "$candidate"
        if ! cmp -s "$candidate" /etc/wireguard/wg-admin.conf; then
          install -m 0600 "$candidate" /etc/wireguard/wg-admin.conf
          echo CHANGED
        fi
      register: admin_vpn_gateway_config
      changed_when: "'CHANGED' in admin_vpn_gateway_config.stdout"
      no_log: true

    - name: Write the administration interface input firewall
      ansible.builtin.template:
        src: admin.nft.j2
        dest: /etc/xcpng-admin.nft
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/nft --check --file %s
      register: admin_vpn_firewall

    - name: Install the administration firewall service
      ansible.builtin.copy:
        dest: /etc/systemd/system/xcpng-admin-firewall.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Administration VPN interface firewall
          After=nftables.service xcpng-router-firewall.service
          Before=wg-quick@wg-admin.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft --file /etc/xcpng-admin.nft
          [Install]
          WantedBy=multi-user.target
      register: admin_vpn_firewall_service

    - name: Require the firewall before the VPN starts
      ansible.builtin.file:
        path: /etc/systemd/system/wg-quick@wg-admin.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the VPN service firewall dependency
      ansible.builtin.copy:
        dest: /etc/systemd/system/wg-quick@wg-admin.service.d/firewall.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Requires=xcpng-admin-firewall.service
          After=xcpng-admin-firewall.service
      register: admin_vpn_service_dependency

    - name: Apply the input firewall before enabling the interface
      ansible.builtin.systemd_service:
        name: xcpng-admin-firewall.service
        daemon_reload: "{{ admin_vpn_firewall_service.changed or admin_vpn_service_dependency.changed }}"
        enabled: true
        state: "{{ 'restarted' if admin_vpn_firewall.changed or admin_vpn_firewall_service.changed else 'started' }}"

    - name: Enable the persistent administration VPN interface
      ansible.builtin.systemd_service:
        name: wg-quick@wg-admin.service
        enabled: true
        state: "{{ 'restarted' if admin_vpn_gateway_config.changed else 'started' }}"

    - name: Reconcile active peers including removed devices
      ansible.builtin.shell: |
        set -eu
        wg syncconf wg-admin <(wg-quick strip wg-admin)
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true

    - name: Read only the gateway public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/admin.key
      register: admin_vpn_gateway_public_key
      changed_when: false

    - name: Prepare the controller public key directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../private/wireguard/sites"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Export only the gateway public key
      ansible.builtin.copy:
        content: "{{ admin_vpn_gateway_public_key.stdout | trim }}\n"
        dest: "{{ playbook_dir }}/../../private/wireguard/sites/{{ inventory_hostname }}.pub"
        mode: '0600'
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
