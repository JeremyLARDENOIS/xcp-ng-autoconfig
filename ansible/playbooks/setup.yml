---
- name: Set up XCP-ng hosts
  hosts: xcpng
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  roles:
    - role: private_net
    - role: host_network
    - role: debian_template
    - role: router_vm

- name: Configure router guests
  hosts: xcpng
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  roles:
    - role: router_access
      ansible_host: "{{ router_address.split('/')[0] }}"
      ansible_user: debian
      ansible_port: 22
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: "-o ProxyJump={{ router_bastion | quote }} -o StrictHostKeyChecking=accept-new"
    - role: router_network
      ansible_host: "{{ router_address.split('/')[0] }}"
      ansible_user: debian
      ansible_port: 22
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: "-o ProxyJump={{ router_bastion | quote }} -o StrictHostKeyChecking=accept-new"
