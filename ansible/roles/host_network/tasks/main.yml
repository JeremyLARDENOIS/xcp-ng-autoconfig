---
- name: Validate the private host address
  ansible.builtin.assert:
    that:
      - bootstrap_host_address | default('') is match('^10\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.254/(2[0-9]|30|1[0-9]|[1-9])$')
    fail_msg: Set bootstrap_host_address to the site's private host address (.254 with a CIDR prefix).

- name: Validate the optional HTTPS destination
  ansible.builtin.assert:
    that:
      - https_forward_address | default('') is string
      - https_forward_address | default('') == '' or https_forward_address is match('^10\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-3])$')
      - https_forward_address | default('') == '' or bootstrap_host_address.endswith('/24')
      - https_forward_address | default('') == '' or https_forward_address.rsplit('.', 1)[0] == bootstrap_host_address.rsplit('.', 1)[0]
      - https_forward_address | default('') == '' or https_forward_address != (xoa_address | default('')).split('/')[0]
    fail_msg: Set https_forward_address to an application IPv4 address in the local private /24, excluding the router, host and XOA; omit it or use an empty string to disable forwarding.

- name: Check the network and the host startup service
  ansible.builtin.raw: |
    set -eu
    network=$(xe network-list name-label=private-net --minimal)
    host=$(xe host-list --minimal)
    case "$network" in ''|*,*) exit 1;; esac
    case "$host" in ''|*,*) exit 1;; esac
    test "$(xe network-param-get uuid="$network" param-name=bridge)" = private-net
    test -z "$(xe pif-list network-uuid="$network" --minimal)"
    systemctl cat xapi.service >/dev/null
  changed_when: false
  check_mode: false

- name: Install the private network startup files
  ansible.builtin.raw: |
    set -eu
    work=$(mktemp -d)
    trap 'rm -rf "$work"' EXIT
    cat > "$work/script" <<'PRIVATE_NET_SCRIPT'
    {{ lookup('file', role_path ~ '/files/private-net.sh') }}
    PRIVATE_NET_SCRIPT
    cat > "$work/service" <<'PRIVATE_NET_SERVICE'
    {{ lookup('template', 'private-net.service.j2') }}
    PRIVATE_NET_SERVICE
    if ! cmp -s "$work/script" /usr/local/sbin/xcpng-private-net; then
      install -m 0755 "$work/script" /usr/local/sbin/xcpng-private-net
      echo CHANGED
    fi
    if ! cmp -s "$work/service" /etc/systemd/system/xcpng-private-net.service; then
      install -m 0644 "$work/service" /etc/systemd/system/xcpng-private-net.service
      echo CHANGED
    fi
    systemctl daemon-reload
    if ! systemctl is-enabled xcpng-private-net.service >/dev/null 2>&1; then
      systemctl enable xcpng-private-net.service
      echo CHANGED
    fi
  register: private_net_install
  changed_when: "'CHANGED' in private_net_install.stdout"
  when: not ansible_check_mode

- name: Configure private addressing and router Internet access
  ansible.builtin.raw: >-
    /usr/local/sbin/xcpng-private-net {{ bootstrap_host_address | quote }} {{ https_forward_address | default('') | quote }}
  register: private_net_address
  changed_when: "'CHANGED' in private_net_address.stdout"
  when: not ansible_check_mode

- name: Display the current private host address and route
  ansible.builtin.raw: |
    if ip link show dev private-net >/dev/null 2>&1; then
      ip -4 -br address show dev private-net
      ip -4 route show dev private-net
      sysctl net.ipv4.ip_forward
      iptables -S XCPNG-PRIVATE-FWD 2>/dev/null || true
      iptables -t nat -S POSTROUTING
    else
      echo 'private-net is not active yet'
    fi
  register: private_net_status
  changed_when: false
  check_mode: false

- name: Display private network status
  ansible.builtin.debug:
    msg: "{{ private_net_status.stdout_lines }}"
